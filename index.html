<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>KLIP.CL Paga tus arriendos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: barra azul de marca arriba, lienzo celeste degradado como la presentación 2012, paneles blancos por rol */
:root{
  --klip:#2463AC; --navy:#22285A; --sky:#1BA1E2; --teal:#2C9FC4; --wa:#1E9E55;
  --owner:#6FA83D; --tenant:#DD6E28; --admin:#C3272B; --bo:#5B3FA8;
  --bg-top:#C7DCFA; --bg-bot:#F1F6FE; --panel:#FFFFFF; --panel-2:#F5F8FD;
  --line:#D5E0F0; --fg:#1B2340; --muted:#5B6888; --ok:#2E8B4E; --warn:#C27A00; --bad:#C3272B;
  --ok-bg:#E3F3E8; --warn-bg:#FFF2D6; --bad-bg:#FBE3E3; --info-bg:#E2EEFB; --bo-bg:#ECE6F8;
  --shadow:0 6px 22px rgba(34,40,90,.12);
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --klip:#5B95DE; --navy:#BFCBF2; --sky:#4DBAEC; --teal:#45B4D6; --wa:#3CC77A;
  --owner:#86C153; --tenant:#F0894A; --admin:#E5585B; --bo:#A68CEB;
  --bg-top:#141B33; --bg-bot:#0E1426; --panel:#1A2240; --panel-2:#212B4D;
  --line:#2E3A62; --fg:#E7ECFA; --muted:#9AA6C6; --ok:#5CC57E; --warn:#E8A93A; --bad:#EE6B6E;
  --ok-bg:#183626; --warn-bg:#3A2D12; --bad-bg:#3D1A1D; --info-bg:#1C2E52; --bo-bg:#2A2350;
  --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --klip:#5B95DE; --navy:#BFCBF2; --sky:#4DBAEC; --teal:#45B4D6; --wa:#3CC77A;
  --owner:#86C153; --tenant:#F0894A; --admin:#E5585B; --bo:#A68CEB;
  --bg-top:#141B33; --bg-bot:#0E1426; --panel:#1A2240; --panel-2:#212B4D;
  --line:#2E3A62; --fg:#E7ECFA; --muted:#9AA6C6; --ok:#5CC57E; --warn:#E8A93A; --bad:#EE6B6E;
  --ok-bg:#183626; --warn-bg:#3A2D12; --bad-bg:#3D1A1D; --info-bg:#1C2E52; --bo-bg:#2A2350;
  --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg-bot);background-image:linear-gradient(180deg,var(--bg-top) 0,var(--bg-bot) 520px);background-repeat:no-repeat;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1D5BA6}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(90deg,#1D5BA6,#2470C2);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top.is-bo{background:linear-gradient(90deg,#3E2A7E,#5B3FA8)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.top .logo{cursor:pointer;background:none;border:0;padding:0;display:flex;align-items:center;gap:10px;color:#fff}
.top .bo-tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:2px 7px}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#fff;color:#1D5BA6}
.who small{display:block;opacity:.8;font-size:12px}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.imp{background:var(--warn-bg);color:var(--fg);border-bottom:1px solid var(--line)}
.imp .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:8px;font-size:14px}
.tabs{background:var(--panel);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;padding-block:0}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-current="page"]{color:var(--klip);border-bottom-color:var(--klip)}
.badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--admin);color:#fff;font-size:11px;margin-left:6px}
main{padding-block:24px 60px}
.grid{display:grid;gap:18px}
.g-side{grid-template-columns:minmax(0,1fr) 300px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g-side,.g-2{grid-template-columns:minmax(0,1fr)}.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.g-4{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:20px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel-b{padding:18px}
.welcome{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.welcome h1{font-size:30px;color:var(--klip)}
.welcome p{margin:0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;padding:9px 16px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#3B86D9,#1D5BA6);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.12);letter-spacing:.02em;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.lg{padding:13px 22px;font-size:17px}
.btn.sec{background:var(--panel-2);color:var(--klip);border:1px solid var(--line);box-shadow:none}
.btn.ok{background:linear-gradient(180deg,#3FA463,#2A7E47)}
.btn.bad{background:var(--panel-2);color:var(--bad);border:1px solid var(--line);box-shadow:none}
.btn.bo{background:linear-gradient(180deg,#7158C2,#4E3497)}
.btn.wa{background:linear-gradient(180deg,#2DBE6C,#1A8C4A)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--klip)}.p-mute{background:var(--panel-2);color:var(--muted)}.p-bo{background:var(--bo-bg);color:var(--bo)}
.muted{color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--klip);text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.code{font-weight:700;color:var(--navy);white-space:nowrap}
.code.link{text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-size:14px}
.sub{display:block;font-size:12px;color:var(--muted)}
.kpi{padding:16px 18px}
.kpi .l{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:28px;font-weight:600;color:var(--navy);line-height:1.2}
.kpi .d{font-size:13px}
.kpi.ok .v{color:var(--ok)}.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--klip);border-color:var(--klip);color:#fff}
.search{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 10px;min-width:0;width:220px;max-width:100%}
.sel{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 8px;max-width:100%}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 10px;width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.form{display:grid;gap:14px}
.form .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.form .row{grid-template-columns:minmax(0,1fr)}}
.empty{padding:28px;text-align:center;color:var(--muted)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:14px;font-weight:600}
.note{background:var(--info-bg);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--fg)}
.link{background:none;border:0;padding:0;color:var(--klip);text-decoration:underline;cursor:pointer;font-size:14px}
.stars{color:#E3A008;letter-spacing:1px;white-space:nowrap}
.totalbar{display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap;padding:14px 18px}
.totalbar .t{font-size:15px;color:var(--muted)}
.totalbar .t b{font-family:var(--f-display);font-size:26px;color:var(--navy);margin-left:6px}
.bill{padding:0}
.bill-h{padding:14px 18px 6px;border-bottom:1px solid var(--line)}
.bill-h h3{font-size:22px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:500}
.bill-h small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bill-b{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:16px;padding:16px 18px;align-items:center}
.amount{font-family:var(--f-display);font-size:42px;font-weight:700;color:var(--navy);line-height:1}
.bill-meta{font-size:14px;color:var(--muted);display:grid;gap:2px;margin-top:8px}
.house{width:120px;height:86px;border-radius:8px;background:var(--info-bg);display:grid;place-items:center;border:1px solid var(--line)}
.bill-f{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel-2);border-radius:0 0 14px 14px}
.addr{text-decoration:underline;color:var(--muted);font-size:14px}
@media (max-width:520px){.bill-b{grid-template-columns:minmax(0,1fr)}.house{display:none}.amount{font-size:36px}}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:14px}
.qa{display:grid;justify-items:center;gap:6px;padding:12px 6px;border-radius:10px;border:1px solid transparent;background:none;cursor:pointer;text-align:center;font-size:13px;color:var(--muted)}
.qa:hover{background:var(--panel-2);border-color:var(--line)}
.qa svg{width:38px;height:38px}
.promo{padding:16px 18px;border-radius:14px;background:linear-gradient(135deg,var(--teal),#1D5BA6);color:#fff}
.promo h3{color:#fff;font-size:18px;margin-bottom:6px}
.promo ul{margin:8px 0 0;padding-left:18px}
.prog{height:16px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(180deg,#7BD15A,#3C9A2E)}
.pct{font-family:var(--f-display);font-size:40px;font-weight:700;color:var(--klip);line-height:1}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.mini{flex:0 0 140px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel-2);font-size:13px}
.mini b{display:block;color:var(--navy)}
.chart{position:relative;min-height:220px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hbar{display:grid;grid-template-columns:130px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:13px}
.hbar .t{height:12px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--klip)}
.msgs{display:grid;gap:10px;max-height:560px;overflow-y:auto}
.msg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2)}
.msg.mine{background:var(--info-bg)}
.msg.wa{border-color:var(--wa)}
.msg .h{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:3px;align-items:center}
.msg .h b{color:var(--navy)}
.wa-tag{color:var(--wa);font-weight:700}
.provs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.prov{padding:16px;display:grid;gap:8px;align-content:start}

.prov .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sec-b{display:inline-block;border:1px solid var(--ok);color:var(--ok);border-radius:6px;font-size:11px;font-weight:700;padding:1px 6px;letter-spacing:.04em}
.acta{display:grid;gap:14px}
.firmas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.firmas{grid-template-columns:minmax(0,1fr)}}
.firma{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel-2)}
.firma.ok{border-color:var(--ok);background:var(--ok-bg)}
.firma b{display:block;color:var(--navy)}
.nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:16px}
.nav a{color:var(--navy);text-decoration:none;font-weight:600;font-size:15px}

.nav .links{display:flex;gap:18px;flex-wrap:wrap}

.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:30px;align-items:center;padding-block:28px 24px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.05;color:var(--navy)}
.hero h1 em{font-style:normal;color:var(--klip)}
.kicker{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--klip);font-weight:700;margin-bottom:10px}
.slogan{font-family:var(--f-display);color:var(--sky);text-transform:uppercase;line-height:.95;font-weight:700}
.slogan .s{display:block;font-size:clamp(18px,2.4vw,26px)}
.slogan .b{display:block;font-size:clamp(44px,7vw,84px)}
.lead{font-size:18px;color:var(--fg);max-width:54ch;margin:16px 0 22px}
.tri svg{width:100%;max-width:500px;height:auto;display:block;margin:0 auto}
.tri .seg{cursor:pointer;transition:transform .2s ease,filter .2s ease;transform-box:fill-box;transform-origin:center}
.tri .seg:hover,.tri .seg:focus{filter:brightness(1.08);transform:scale(1.03);outline:none}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-block:10px 34px}
@media (max-width:860px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px}
.fact b{display:block;font-family:var(--f-display);font-size:19px;color:var(--navy)}
.video{display:flex;align-items:center;gap:20px;flex-wrap:wrap;text-decoration:none;color:#fff;border-radius:18px;padding:26px 28px;background:linear-gradient(120deg,#22285A,#2463AC 55%,#1BA1E2);box-shadow:var(--shadow);min-height:150px}
.video:hover .play{transform:scale(1.06)}
.video .play{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.7);display:grid;place-items:center;transition:transform .2s ease;flex:0 0 auto}
.video .vtxt{display:grid;gap:2px;min-width:0}

.sect{padding-block:34px}
.sect h2{font-size:clamp(26px,3.4vw,36px);margin-bottom:8px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px;counter-reset:st}

.r-owner{background:linear-gradient(180deg,#8BC34A,#5E9631)}
.r-tenant{background:linear-gradient(180deg,#F39A3D,#D2611E)}
.r-admin{background:linear-gradient(180deg,#D8433F,#A61F23)}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}

.feat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}

.acc{display:grid;gap:6px;margin-top:6px}
.acc button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:8px 11px;cursor:pointer;font-size:13px}
.acc button:hover{border-color:var(--klip)}
.acc b{color:var(--navy)}
.lab-tipo{display:inline-block;min-width:62px;text-align:center;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.t-idea{background:var(--info-bg);color:var(--klip)}
.t-cambio{background:var(--ok-bg);color:var(--ok)}
.t-error{background:var(--bad-bg);color:var(--bad)}
.timeline{display:grid;gap:16px}
.tl-v{border-left:3px solid var(--klip);padding-left:14px}
.tl-v h3{font-size:17px}
.tl-v ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.prio{font-weight:700;font-size:12px}
.prio-Alta{color:var(--bad)}.prio-Media{color:var(--warn)}.prio-Baja{color:var(--muted)}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,16,40,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(760px,100%);max-height:100%;overflow-y:auto;border:1px solid var(--line)}
.modal-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:21px;flex:1}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
.modal-b{padding:20px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.detail{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px}
.detail .left{border-right:1px solid var(--line);padding-right:20px;text-align:center}
@media (max-width:560px){.detail{grid-template-columns:minmax(0,1fr)}.detail .left{border-right:0;padding-right:0}}
.lines{display:grid;gap:6px}
.lines div{display:flex;justify-content:space-between;gap:12px}
.lines .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--panel-2)}
.opt:has(input:checked){border-color:var(--klip);background:var(--info-bg)}
.receipt{text-align:center;display:grid;gap:8px;justify-items:center;padding:10px 0}
.receipt .ok{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:34px}
.secret{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;background:var(--panel-2);border:1px dashed var(--line);border-radius:8px;padding:8px 14px;user-select:all}
.bday{text-align:center;display:grid;gap:12px;justify-items:center;padding:6px 0}
.bday .big{font-family:var(--f-display);font-size:clamp(30px,6vw,44px);color:var(--klip);line-height:1.05}
.bday p{font-size:17px;max-width:46ch;margin:0;white-space:pre-line}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--navy);color:var(--panel);padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

async function doLogin(){
  const email=document.getElementById("lemail").value.trim().toLowerCase(),pw=document.getElementById("lpass").value,rem=document.getElementById("lrem").checked;
  ui.loginEmail=email;
  if(!email||!pw){ui.loginErr="Escribe tu correo y tu contraseña.";render();return}
  const u=S.users.find(x=>x.email.toLowerCase()===email);
  if(!u){log("Acceso fallido","Correo no registrado: "+email,"Visitante");save();ui.loginErr="El correo o la contraseña no son correctos.";render();return}
  if(u.bloqueado){ui.loginErr="La cuenta está bloqueada por intentos fallidos. Pide al back office que la desbloquee.";render();return}
  if(!u.activo){ui.loginErr="La cuenta está desactivada. Contacta con el back office.";render();return}
  let h="";try{h=await hashPw(pw)}catch(e){ui.loginErr="Este navegador no permite verificar la contraseña. Prueba con otro navegador.";render();return}
  if(h!==u.hash){u.intentos=(u.intentos||0)+1;if(u.intentos>=5){u.bloqueado=true;log("Cuenta bloqueada",u.email+" tras 5 intentos fallidos","Sistema")}else log("Acceso fallido",u.email+" (intento "+u.intentos+" de 5)","Visitante");save();
    ui.loginErr=u.bloqueado?"Cuenta bloqueada tras 5 intentos fallidos. Pide al back office que la desbloquee.":"El correo o la contraseña no son correctos. Te quedan "+(5-u.intentos)+" intentos.";render();return}
  startSession(u,rem);
}
function startSession(u,rem){
  u.intentos=0;u.ultimo=nowISO();ui.uid=u.id;ui.asUid=null;ui.asBo=false;ui.loginErr="";ui.loginEmail="";ui.regErr="";setSession(u.id,rem);
  log("Inicio de sesión",ROLES[u.role],u.nombre);save();
  ui.screen="app";ui.tab=TABS[u.role][0][0];ui.q="";render();window.scrollTo(0,0);
  if(u.cambiar)mChangePw(true);
  else if(u.actorId==="a1"&&S.params.bienvenida.activo&&!S.params.bienvenida.mostrado)mBday();
}
async function doRegister(){
  const g=id=>document.getElementById(id).value.trim();
  const r=g("rrol"),nom=g("rnom"),em=g("rem").toLowerCase(),wa=g("rwa"),p1=document.getElementById("rp1").value,p2=document.getElementById("rp2").value,emp=g("remp"),term=document.getElementById("rterm").checked;
  const fail=m=>{ui.regErr=m;ui.regHint=r;render();const keep={rnom:nom,rem:em,rwa:wa,remp:emp};Object.keys(keep).forEach(k=>{const e=document.getElementById(k);if(e)e.value=keep[k]});document.getElementById("rterm").checked=term};
  if(!nom||!em)return fail("Completa tu nombre y tu correo.");
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return fail("El correo no tiene un formato válido.");
  if(r==="admin"&&!emp)return fail("Escribe el nombre de tu administradora.");
  if(S.users.some(u=>u.email.toLowerCase()===em))return fail("Ya existe una cuenta con ese correo. Inicia sesión o usa otro correo.");
  if(p1.length<8||!/[A-Za-z]/.test(p1)||!/\d/.test(p1))return fail("La contraseña debe tener al menos 8 caracteres, con letras y números.");
  if(p1!==p2)return fail("Las dos contraseñas no coinciden.");
  if(!term)return fail("Debes aceptar los términos para crear la cuenta.");
  let actor;
  if(r==="tenant"){actor="t"+uid("n");S.tenants.push({id:actor,nombre:nom,desde:todayISO(),wa})}
  if(r==="owner"){actor="o"+uid("n");S.owners.push({id:actor,nombre:nom,wa})}
  if(r==="admin"){actor="a"+uid("n");S.administradoras.push({id:actor,nombre:emp,contacto:nom,ciudad:"Santiago",comuna:"",comisionAdm:8,desde:S.periodo.ym,wa})}
  const u={id:uid("u"),nombre:nom,email:em,role:r,actorId:actor,hash:await hashPw(p1),activo:true,bloqueado:false,intentos:0,ultimo:null,cambiar:false,wa};
  S.users.push(u);log("Registro","Nueva cuenta de "+ROLES[r]+": "+em,nom);save();
  startSession(u,false);toast("Cuenta creada. Bienvenido a KLIP");
}

  admin:[["resumen","Resumen"],["propiedades","Cartera"],["arrendatarios","Arrendatarios"],["liquidaciones","Liquidaciones"],["solicitudes","Reparaciones"],["proveedores","Proveedores"],["historico","Histórico"],["contratos","Contratos"],["comunidades","Comunidades"],["mensajes","Mensajes"]],
  bo:[["panel","Panel"],["administradoras","Administradoras"],["usuarios","Usuarios"],["proveedores","Proveedores"],["parametros","Parámetros"],["auditoria","Auditoría"],["lab","Lab"]]};

function shell(){
  const u=cur(),r=role(),me=meActor(),unr=unread(),full=!ui.asUid&&sessUser()&&sessUser().bo;
  const pend=S.repairs.filter(x=>{const p=prop(x.propId);if(!p)return false;if(x.estado==="solicitada")return (r==="admin"&&p.adminId===me)||(r==="owner"&&p.ownerId===me);if(x.estado==="aprobada")return r==="tenant"&&x.tenantId===me;return false}).length;
  const labOpen=LAB.items.filter(i=>i.estado==="Propuesta").length;
  const tabs=TABS[r].map(([k,l])=>`<button class="tab" data-act="tab" data-tab="${k}" ${ui.tab===k?'aria-current="page"':""}>${l}${k==="mensajes"&&unr?`<span class="badge">${unr}</span>`:""}${(k==="solicitudes"||k==="reparaciones")&&pend?`<span class="badge">${pend}</span>`:""}${k==="lab"&&labOpen?`<span class="badge" style="background:var(--bo)">${labOpen}</span>`:""}</button>`).join("");
  const imp=ui.asUid?`<div class="imp"><div class="wrap"><span>Estás viendo la plataforma como <b>${esc(u.nombre)}</b> (${ROLES[r]}). Las acciones quedan registradas a su nombre en la auditoría.</span><button class="btn sm" data-act="stopimp">Volver al back office</button></div></div>`:"";
  const emp=r==="admin"?empresaDe(me):"";
  return `<header class="top ${r==="bo"?"is-bo":""}"><div class="wrap">
      <button class="logo" data-act="tab" data-tab="${TABS[r][0][0]}" aria-label="Ir al inicio">${LOGO(150,false)}${r==="bo"?'<span class="bo-tag">Back office</span>':""}</button><span class="spacer"></span>
      <div class="who"><div><b>Hola ${esc(u.nombre.split(" ")[0])}</b><small>${emp?esc(emp):ROLES[r]}${full&&r!=="bo"?", acceso total":""}</small></div><span class="av">${esc(u.nombre[0])}</span></div>
      ${full?`<button class="btn-ghost" data-act="swbo">${r==="bo"?"Mi administradora":"Back office"}</button>`:""}${ui.asUid?"":`<button class="btn-ghost" data-act="profile">Mi perfil</button>`}
      <button class="btn-ghost" data-act="logout">Cerrar sesión</button>
    </div></header>${imp}
    <nav class="tabs" aria-label="Secciones"><div class="wrap">${tabs}</div></nav>
    <main class="wrap">${view()}</main>
    <footer class="wrap foot"><span>Periodo de cobro: ${ymLabel(S.periodo.ym)}. UF referencial ${clp(UF())}.</span>${r!=="bo"?`<button class="link" data-act="suggest">Sugerir una mejora</button>`:""}</footer>`;
}
function view(){
  const r=role(),t=ui.tab;
  if(t==="proveedores")return vProveedores();
  if(r==="bo")return t==="administradoras"?vAdministradoras():t==="usuarios"?vUsers():t==="parametros"?vParams():t==="auditoria"?vAudit():t==="lab"?vLab():vBoPanel();
  if(t==="mensajes")return vMensajes();
  if(r==="tenant")return t==="reparaciones"?vRepairs():t==="historial"?vHist():vTenantHome();
  if(r==="owner")return t==="solicitudes"?vRepairs():t==="historial"?vHist():t==="liquidacion"?vLiquidaciones():vOwner();
  if(t==="propiedades")return vAdminProps();
  if(t==="arrendatarios")return vAdminTenants();
  if(t==="liquidaciones")return vLiquidaciones();
  if(t==="comunidades")return vComunidades();
  if(t==="contratos")return vContratos();
  if(t==="solicitudes")return vRepairs();
  if(t==="historico")return vHistorico(myProps(),"Histórico de la cartera");
  return vAdminHome();
}

/* Arrendatario */

  const total=props.reduce((a,p)=>a+aPagarArriendo(p)+aPagarGC(p),0);
  const cards=props.map(p=>{
    const o=ownerOf(p),a=admOf(p),ar=aPagarArriendo(p),gc=aPagarGC(p),dsc=descuento(p);

        <div class="bill-meta"><span>Mes ${ymLabel(S.periodo.ym)}, vence ${dmy(S.periodo.vence)}</span><span>Arriendo del mes ${clp(rentCLP(p))}${p.moneda==="UF"?" (UF "+fmt.format(p.monto)+")":""}${dsc&&!p.paid?", descuento reparación "+clp(dsc):""}</span><span><button class="link" data-act="detail" data-id="${p.id}">Ver detalle de arriendo a pagar</button></span></div></div>
        <div class="house">${ICON.house}</div></div>
      <div class="bill-f"><span class="addr">${esc(p.dir)}, ${esc(p.comuna)}</span>${p.paid?`<span class="pill p-ok">Pagado el ${dmy(p.lastPay)}</span>`:`<button class="btn sm" data-act="pay" data-items="${p.id}:a">Pagar este arriendo</button>`}</div></article>
    <article class="panel bill"><div class="bill-h"><h3>Gastos comunes</h3><small>${esc(p.gc.comunidad)} / ${esc(a?a.nombre:"")}</small></div>
      <div class="bill-b"><div><div class="amount num">${p.gcPaid?"Pagado":clp(gc)}</div>
        <div class="bill-meta"><span>Mes ${ymLabel(S.periodo.ym)}, vence ${dmy(S.periodo.vence)}</span><span>Cuota del mes ${clp(p.gc.monto)}${p.gcDeuda?", saldo anterior "+clp(p.gcDeuda):""}</span></div></div>
        <div class="house">${ICON.house}</div></div>
      <div class="bill-f"><span class="addr">${esc(p.dir)}, ${esc(p.comuna)}</span>${p.gcPaid?`<span class="pill p-ok">Pagado</span>`:`<button class="btn sm" data-act="pay" data-items="${p.id}:g">Pagar gastos comunes</button>`}</div></article>`;}).join("");
  const p=props[0],toConf=S.repairs.filter(r=>r.tenantId===me&&r.estado==="aprobada");
  const t=byId(S.tenants,me);
  return `<div class="welcome"><h1>Hola ${esc(nombreActor(me).split(" ")[0])}</h1><p>Arrendatario desde ${ymLabel(t.desde.slice(0,7))}. Todo lo de tu arriendo en un solo lugar.</p></div>
  ${toConf.length?`<div class="note" style="margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span>El propietario aprobó <b>${esc(toConf[0].desc.toLowerCase())}</b>. Cuando el trabajo esté hecho, confirma tu conformidad para que empiece el descuento.</span><button class="btn sm ok" data-act="acta" data-id="${toConf[0].id}">Revisar y confirmar</button></div>`:""}
  <div class="grid g-side"><div class="grid">
    <div class="panel totalbar"><span class="t">Total gastos<b class="num">${clp(total)}</b></span><button class="btn" data-act="pay" data-items="${props.map(p=>(p.paid?"":p.id+":a,")+(p.gcPaid?"":p.id+":g,")).join("")}" ${total?"":"disabled"}>Pagar mis gastos</button></div>

    <aside class="grid" style="align-content:start">

        <button class="qa" data-act="tab" data-tab="historial">${ICON.hist}Historial de pago</button>
        <button class="qa" data-act="newrep" data-id="${p.id}">${ICON.tool}Solicitar reparación</button>

      <div class="promo"><h3>Paga con tarjeta y gana beneficios</h3><span>Con las alianzas bancarias de KLIP tu arriendo suma:</span><ul><li>Kilómetros de aerolínea</li><li>Puntos de tu banco</li><li>Descuentos en comercios asociados</li></ul></div>

/* Reparaciones */
function repStateLabel(r){
  if(r.estado==="solicitada")return `<span class="pill p-warn">Esperando al propietario</span>`;
  if(r.estado==="aprobada")return `<span class="pill p-info">Aprobada, falta conformidad</span>`;
  if(r.estado==="rechazada")return `<span class="pill p-bad">Rechazada</span>`;
  if(r.descontadas<r.cuotas)return `<span class="pill p-info">Descontando ${r.descontadas} de ${r.cuotas}</span>`;
  return `<span class="pill p-ok">Descontada</span>`;
}
function vRepairs(){
  const r=role(),me=meActor(),ids=new Set(myProps().map(p=>p.id));
  const list=repsAll().filter(x=>r==="tenant"?x.tenantId===me:ids.has(x.propId));
  const activas=list.filter(x=>!x.gen&&x.estado!=="rechazada"&&(x.estado!=="conforme"||x.descontadas<x.cuotas));
  const firmadas=list.filter(x=>x.estado==="conforme").sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const shown=ui.repFilter==="activas"?activas:firmadas;
  const p0=r==="tenant"?S.props.find(x=>x.tenantId===me):null;
  const totalDesc=firmadas.reduce((a,x)=>a+x.monto,0);
  return `<div class="welcome"><h1>Reparaciones</h1><p>Lo que aprueban propietario y arrendatario se descuenta del arriendo. ${firmadas.length} reparaciones firmadas por ${clp(totalDesc)}.</p><span style="flex:1"></span>${p0?`<button class="btn" data-act="newrep" data-id="${p0.id}">Solicitar reparación</button>`:""}</div>
  <div class="panel"><div class="panel-h"><div class="chips"><button class="chip" data-act="repf" data-v="activas" aria-pressed="${ui.repFilter==="activas"}">En curso (${activas.length})</button><button class="chip" data-act="repf" data-v="hist" aria-pressed="${ui.repFilter!=="activas"}">Historial firmado (${firmadas.length})</button></div></div>
  ${shown.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Propiedad</th><th>Reparación</th><th>Proveedor</th><th class="r">Monto</th><th>Descuento</th><th>Estado</th><th></th></tr></thead><tbody>${shown.slice(0,120).map(x=>{const p=prop(x.propId),pv=provById(x.provId);
    const canApprove=x.estado==="solicitada"&&((r==="owner"&&p.ownerId===me)||(r==="admin"&&p.adminId===me));
    const canConf=x.estado==="aprobada"&&r==="tenant"&&x.tenantId===me;
    return `<tr><td class="num">${dmy(x.fecha)}</td><td><span class="code">${p.code}</span><span class="sub">${esc(p.dir)}</span></td><td>${esc(x.desc)}<span class="sub">${esc(x.cat)}, ${esc(nombreActor(x.tenantId))}</span></td><td>${pv?esc(pv.nombre):"Por definir"}</td><td class="r num">${clp(x.monto)}</td><td class="num">${x.cuotas} x ${clp(cuota(x))}</td><td>${repStateLabel(x)}</td><td>${canApprove?`<button class="btn sm ok" data-act="approve" data-id="${x.id}">Revisar</button>`:canConf?`<button class="btn sm ok" data-act="acta" data-id="${x.id}">Confirmar</button>`:`<button class="btn sm sec" data-act="acta" data-id="${x.id}">Ver acta</button>`}</td></tr>`}).join("")}</tbody></table></div>${shown.length>120?`<p class="muted" style="padding:0 18px 14px;font-size:13px">Se muestran las 120 más recientes de ${shown.length}.</p>`:""}`:`<div class="empty">${ui.repFilter==="activas"?"No hay reparaciones en curso.":"Aún no hay reparaciones firmadas."}</div>`}</div>`;
}

/* Proveedores */

  <div class="panel" style="margin-bottom:16px"><div class="panel-h"><select class="sel" id="provcat" aria-label="Especialidad"><option value="todas">Todas las especialidades</option>${CAT_NAMES.map(c=>`<option ${c===cat?"selected":""}>${c}</option>`).join("")}</select><select class="sel" id="provcity" aria-label="Ciudad"><option value="todas">Todas las ciudades</option>${["Santiago","Valparaíso","Concepción"].map(c=>`<option ${c===city?"selected":""}>${c}</option>`).join("")}</select><span style="flex:1"></span><input class="search" id="q" type="search" placeholder="Buscar por nombre o comuna" value="${esc(ui.q)}" aria-label="Buscar proveedores"></div></div>

/* Propietario */
function vOwner(){
  const me=meActor(),props=S.props.filter(p=>p.ownerId===me);
  if(!props.length)return `<div class="welcome"><h1>Hola ${esc(nombreActor(me).split(" ")[0])}</h1></div><div class="panel empty"><h2 style="margin-bottom:8px">Aún no tienes propiedades en KLIP</h2><p>Tu administradora puede cargarlas con tu correo <b>${esc(cur().email)}</b>.</p></div>`;
  const neto=props.map(liquidacion).reduce((a,l)=>a+l.neto,0);
  const pend=props.filter(p=>p.tenantId&&!p.paid).reduce((a,p)=>a+rentCLP(p)+p.deuda,0);
  const rented=props.filter(p=>p.tenantId);
  const rprom=rented.length?rented.reduce((a,p)=>a+rentab(p),0)/rented.length:0;
  const sectores={};props.forEach(p=>{(sectores[p.comuna]=sectores[p.comuna]||[]).push(p)});
  const allSec={};S.props.filter(p=>p.tenantId).forEach(p=>{(allSec[p.comuna]=allSec[p.comuna]||[]).push(rentab(p))});
  const desde=props.reduce((a,p)=>p.alta<a?p.alta:a,"9999-99");
  return `<div class="welcome"><h1>Hola ${esc(nombreActor(me).split(" ")[0])}</h1><p>Propietario en KLIP desde ${ymLabel(desde)}. Tus pagos llegan desde una sola entidad.</p></div>
  <div class="grid g-4" style="margin-bottom:18px">
    <div class="panel kpi"><div class="l">Propiedades</div><div class="v num">${props.length}</div><div class="d muted">${rented.length} arrendadas</div></div>
    <div class="panel kpi ok"><div class="l">Neto ${ymLabel(S.periodo.ym)}</div><div class="v num">${clp(neto)}</div><div class="d muted">después de comisión e IVA</div></div>
    <div class="panel kpi ${pend?"warn":""}"><div class="l">Por recibir</div><div class="v num">${clp(pend)}</div><div class="d muted">incluye saldos atrasados</div></div>
    <div class="panel kpi"><div class="l">Rentabilidad bruta</div><div class="v num">${pct1(rprom)}</div><div class="d muted">anual promedio arrendadas</div></div></div>
  <div class="grid g-side"><div class="panel"><div class="panel-h"><h2>Mis inversiones</h2></div><div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Dirección</th><th>Arrendatario</th><th class="r">Arriendo</th><th>Estado</th><th>Último pago</th><th class="r">Rentab.</th></tr></thead><tbody>${props.map(p=>{const e=estado(p),t=tenantOf(p);return `<tr><td><button class="code link" data-act="ficha" data-id="${p.id}">${p.code}</button></td><td>${esc(p.dir)}<span class="sub">${esc(p.comuna)}, ${esc((admOf(p)||{}).nombre||"")}</span></td><td>${t?esc(t.nombre):'<span class="muted">Disponible</span>'}</td><td class="r num">${rentLabel(p)}${p.moneda==="UF"?`<span class="sub">${clp(rentCLP(p))}</span>`:""}</td><td><span class="pill ${e.c}">${e.t}</span>${p.deuda?`<span class="sub">Debe ${clp(p.deuda)}</span>`:""}</td><td class="num">${dmy(p.lastPay)}</td><td class="r num">${p.tenantId?pct1(rentab(p)):"-"}</td></tr>`}).join("")}</tbody></table></div></div>
  <aside class="panel" style="align-self:start"><div class="panel-h"><h2>Rentabilidad por sector</h2></div><div class="panel-b"><div class="tbl-wrap"><table><thead><tr><th>Comuna</th><th class="r">Tuyas</th><th class="r">Mercado KLIP</th></tr></thead><tbody>${Object.keys(sectores).map(c=>{const mine=sectores[c].filter(p=>p.tenantId);const m=mine.length?mine.reduce((a,p)=>a+rentab(p),0)/mine.length:null;const mk=allSec[c]?allSec[c].reduce((a,b)=>a+b,0)/allSec[c].length:null;return `<tr><td>${esc(c)}</td><td class="r num">${m==null?"-":pct1(m)}</td><td class="r num">${mk==null?"-":pct1(mk)}</td></tr>`}).join("")}</tbody></table></div><p class="muted" style="font-size:12px;margin:10px 0 0">Rentabilidad bruta anual: arriendo por 12 sobre el valor de la propiedad en UF.</p></div></aside></div>
  <div style="margin-top:18px">${vHistoricoBlock(props)}</div>`;
}
function vLiquidaciones(){
  const props=myProps().filter(p=>p.tenantId||liquidacion(p).pagado);
  const rows=props.map(p=>({p,l:liquidacion(p)}));
  const tot=rows.reduce((a,x)=>{a.b+=x.l.bruto;a.d+=x.l.desc;a.c+=x.l.com;a.i+=x.l.iva;a.n+=x.l.neto;return a},{b:0,d:0,c:0,i:0,n:0});
  const r=role();
  return `<div class="welcome"><h1>${r==="owner"?"Mi liquidación":"Liquidaciones a propietarios"}</h1><p>${ymLabel(S.periodo.ym)}. Arriendo cobrado menos reparaciones aprobadas, comisión de administración e IVA. Transferencia en 72 horas hábiles desde el pago.</p></div>
  <div class="panel"><div class="tbl-wrap"><table><thead><tr><th>Propiedad</th>${r==="admin"?"<th>Propietario</th>":""}<th class="r">Canon</th><th class="r">Reparaciones</th><th class="r">Comisión</th><th class="r">IVA</th><th class="r">Neto</th><th>Estado</th></tr></thead><tbody>${rows.map(({p,l})=>`<tr><td><span class="code">${p.code}</span><span class="sub">${esc(p.dir)}</span></td>${r==="admin"?`<td>${esc((ownerOf(p)||{}).nombre||"")}</td>`:""}<td class="r num">${clp(l.bruto)}</td><td class="r num">${l.desc?"-"+clp(l.desc):"-"}</td><td class="r num">${l.com?"-"+clp(l.com):"-"}</td><td class="r num">${l.iva?"-"+clp(l.iva):"-"}</td><td class="r num"><b>${clp(l.neto)}</b></td><td>${l.pagado?'<span class="pill p-ok">Liquidado</span>':'<span class="pill p-warn">Esperando pago</span>'}</td></tr>`).join("")}
  <tr><td><b>Total</b></td>${r==="admin"?"<td></td>":""}<td class="r num"><b>${clp(tot.b)}</b></td><td class="r num">${tot.d?"-"+clp(tot.d):"-"}</td><td class="r num">-${clp(tot.c)}</td><td class="r num">-${clp(tot.i)}</td><td class="r num"><b>${clp(tot.n)}</b></td><td></td></tr></tbody></table></div></div>`;
}

/* Administradora */
function adminCounts(props){
  const al=props.filter(p=>estado(p).k==="aldia"),mo=props.filter(p=>estado(p).k==="morosa"),va=props.filter(p=>estado(p).k==="vacia");
  const esperado=esperadoMes(props),recaudado=arriendosMes(S.periodo.ym,props);
  return {al,mo,va,esperado,recaudado,pct:esperado?Math.min(100,Math.round(recaudado/esperado*100)):0};
}
function chartBlock(scope){

function yearStats(props){
  const ids=new Set(props.map(p=>p.id)),Y={};
  histAll().forEach(h=>{if(!ids.has(h.p))return;const y=h.ym.slice(0,4);const s=Y[y]=Y[y]||{a:0,g:0,d:0,n:0};if(h.c==="A"){s.a+=h.m;s.d+=h.d;s.n++}else s.g+=h.m});
  return Y;
}
function vHistoricoBlock(props){

}

function contacts(){

/* Gráficos de barras escalados al ancho real */
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function drawBars(el,data,ref,refLabel){
  const W=Math.max(300,Math.round(el.clientWidth||640)),H=W<520?220:260;
  const L=W<520?46:60,R=10,T=26,B=28;
  const max=Math.max(ref||0,...data.map(d=>d.v),1);
  const step=niceStep(max/4),top=Math.ceil(max*1.08/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top);
  const band=(W-L-R)/data.length,bw=Math.max(6,band*0.64);
  const lblEvery=Math.max(1,Math.ceil(data.length*38/(W-L-R)));
  const fmtAx=v=>v===0?"0":v>=1e9?(v/1e9).toLocaleString("es-CL",{maximumFractionDigits:1})+" mil M":(v/1e6).toLocaleString("es-CL",{maximumFractionDigits:1})+"M";
  let g="";
  for(let v=0;v<=top+1;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtAx(v)}</text>`}
  data.forEach((d,i)=>{
    const cx=L+band*i+band/2,yy=y(d.v),h=Math.max(0,y(0)-yy);
    g+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${d.cur?"var(--sky)":"var(--klip)"}" opacity="${d.cur?1:.85}"><title>${esc(d.title)}: ${clp(d.v)}${d.cur?" (en curso)":""}</title></rect>`;
    if((data.length-1-i)%lblEvery===0)g+=`<text x="${cx.toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="11" fill="${d.cur?"var(--navy)":"var(--muted)"}" font-weight="${d.cur?700:400}">${esc(d.label)}</text>`;
  });
  let ye=null;
  if(ref){ye=y(ref);g+=`<line x1="${L}" x2="${W-R}" y1="${ye.toFixed(1)}" y2="${ye.toFixed(1)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${L+4}" y="${Math.max(12,ye-6).toFixed(1)}" font-size="11" font-weight="700" fill="var(--bad)">${esc(refLabel)}</text>`}
  const last=data[data.length-1],lx=L+band*(data.length-1)+band/2;let ly=Math.max(12,y(last.v)-7);if(ye!=null&&ly>ye-16&&ly<ye+4)ly=ye-20;
  g+=`<text x="${Math.min(W-R,lx+bw/2).toFixed(1)}" y="${Math.max(12,ly).toFixed(1)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--navy)">${mill(last.v)}</text>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}</svg>`;
}
function drawCharts(){
  document.querySelectorAll('[data-chart="recaudo"]').forEach(el=>{
    const props=scopeProps(el.dataset.scope),c=S.periodo.ym;
    const data=[];for(let i=11;i>=0;i--){const ym=ymAdd(c,-i);data.push({label:ymShort(ym)+(ym.endsWith("-01")?" "+ym.slice(2,4):""),title:ymLabel(ym),v:arriendosMes(ym,props),cur:i===0})}
    const esp=esperadoMes(props);
    drawBars(el,data,esp,"Esperado "+mill(esp));
  });
  document.querySelectorAll('[data-chart="anual"]').forEach(el=>{
    const ids=new Set(el.dataset.ids.split(","));const props=S.props.filter(p=>ids.has(p.id));
    const Y=yearStats(props),years=Object.keys(Y).sort();if(!years.length){el.innerHTML="";return}
    drawBars(el,years.map(y=>({label:"'"+y.slice(2),title:y,v:Y[y].a,cur:y===S.periodo.ym.slice(0,4)})),0,"");
  });
}

  if(!its.length){toast("No hay montos pendientes");return}
  const tot=its.reduce((a,i)=>a+i.monto,0);
  const sub={"Tarjeta de crédito":"Acumula kilómetros y puntos","Tarjeta de débito":"Cargo inmediato en tu cuenta","Tarjeta retail":"Tarjetas de casas comerciales","Transferencia":"Desde tu banco"};
  const med=Object.keys(S.params.medios).filter(m=>S.params.medios[m]);

function payArriendo(p,medio){
  const m=aPagarArriendo(p),dsc=descuento(p),reps=repairsOn(p),hoy=todayISO();
  S.hist.push({id:uid("h"),f:hoy,ym:S.periodo.ym,p:p.id,t:p.tenantId,c:"A",m,md:medio,d:dsc,r:reps.length?reps[0].id:null});
  reps.forEach(r=>r.descontadas++);p.paid=true;p.deuda=0;p.lastPay=hoy;return m;
}
function doPay(){
  const f=document.getElementById("payform");if(!f)return;
  const medio=(f.querySelector("input[name=medio]:checked")||{}).value;
  const cuotas=medio==="Tarjeta de crédito"?document.getElementById("cuotas").value:"1";
  const btn=mroot.querySelector('[data-act="confirmpay"]');btn.disabled=true;btn.textContent="Procesando pago...";
  setTimeout(()=>{
    let tot=0;const hoy=todayISO();const lines=[];
    f.dataset.items.split(",").filter(Boolean).forEach(s=>{const [id,k]=s.split(":");const p=prop(id);
      if(k==="a"&&!p.paid){const m=payArriendo(p,medio);tot+=m;lines.push("arriendo");
        S.msgs.push({id:uid("m"),from:p.adminId,to:p.ownerId,text:"KLIP recibió el pago de arriendo de "+p.dir+" por "+clp(m)+". Tu liquidación se transferirá en 72 horas hábiles.",fecha:hoy,read:false,canal:"plataforma"});}
      if(k==="g"&&!p.gcPaid){const m=aPagarGC(p);tot+=m;p.gcPaid=true;p.gcDeuda=0;
        S.hist.push({id:uid("h"),f:hoy,ym:S.periodo.ym,p:id,t:p.tenantId,c:"G",m,md:medio,d:0,r:null});lines.push("gastos comunes");}
    });
    const n="KLIP-"+Math.floor(100000+Math.random()*900000);
    log("Pago",clp(tot)+" con "+medio+", comprobante "+n);save();
    document.getElementById("mb").innerHTML=`<div class="receipt"><div class="ok">&#10003;</div><h3 style="font-size:24px">Pago realizado</h3><div class="amount num" style="font-size:34px">${clp(tot)}</div><span class="muted">Comprobante ${n}, ${dmy(hoy)}</span><span>${esc(medio)}${cuotas!=="1"?", "+cuotas+" cuotas":""}</span><span class="muted">Pagaste ${lines.join(" y ")}. El propietario y la administradora ya lo ven en su panel.</span></div>`;
    document.getElementById("mf").innerHTML=`<button class="btn" data-act="close">Listo</button>`;
    render();
  },900);
}

function mLab(id,preset){
  const it=id?LAB.items.find(x=>x.id===id):Object.assign({tipo:"Idea",estado:"Propuesta",prioridad:"Media",area:"Plataforma",version:"",titulo:"",detalle:""},preset||{});
  if(!it)return;
  const o=(arr,v)=>arr.map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("");
  openModal(id?"Editar entrada del Lab":(preset?"Sugerir una mejora":"Nueva entrada del Lab"),`<form id="labform" class="form" data-id="${id?esc(id):""}">
    <div class="row"><div class="field"><label for="lt">Tipo</label><select id="lt">${o(LAB_TIPOS,it.tipo)}</select></div><div class="field"><label for="la">Área</label><select id="la">${o(LAB_AREAS,it.area)}</select></div></div>

    <div class="field"><label for="ldet">Detalle</label><textarea id="ldet" rows="4" maxlength="2000" placeholder="Qué problema resuelve, para quién y cómo">${esc(it.detalle||"")}</textarea></div>
    ${preset?"":`<div class="row"><div class="field"><label for="lp">Prioridad</label><select id="lp">${o(["Alta","Media","Baja"],it.prioridad)}</select></div><div class="field"><label for="le">Estado</label><select id="le">${o(LAB_EST,it.estado)}</select></div></div>
    <div class="field"><label for="lv">Versión</label><input id="lv" value="${esc(it.version||"")}" placeholder="Ej.: 0.4"></div>`}</form>`,
  `${id?`<button class="btn bad" data-act="labdel" data-id="${esc(id)}">Eliminar</button>`:""}<span style="flex:1"></span><button class="btn sec" data-act="close">Cancelar</button><button class="btn bo" data-act="labsave">${preset?"Enviar al Lab":"Guardar"}</button>`);

    case "labdel":{const id=el.dataset.id;openModal("Eliminar entrada",'<p style="margin:0">La entrada se borra del Lab para todo el equipo. Esta acción no se puede deshacer.</p>',`<button class="btn sec" data-act="close">Cancelar</button><button class="btn bad" data-act="labdodel" data-id="${esc(id)}">Eliminar</button>`);break;}
    case "labdodel":try{await labDelete(el.dataset.id);log("Lab","Entrada eliminada");save();closeModal();render();toast("Entrada eliminada")}catch(err){labErr(err)}break;
  }
});

  if(t.name==="medio"){const w=document.getElementById("cuotaswrap");if(w)w.hidden=t.value!=="Tarjeta de crédito";}
  if(t.id==="labest"){ui.lab.estado=t.value;render();}
  if(t.id==="histyear"){ui.year=t.value;render();}
  if(t.id==="provcat"){ui.provCat=t.value;render();}
  if(t.id==="provcity"){ui.provCity=t.value;render();}
  if(t.id==="rrol"){const w=document.getElementById("rempw");if(w)w.hidden=t.value!=="admin";}
  if(t.id==="rcat"){const f=document.getElementById("repform");const p=prop(f.dataset.id);document.getElementById("rprov").innerHTML=provOptions(p.ciudad,t.value,null);}
  if(t.dataset&&t.dataset.labstate){const id=t.dataset.labstate;try{await labUpdate(id,{estado:t.value,actualizado:nowISO()});log("Lab","Estado cambiado a "+t.value);save();toast("Estado actualizado")}catch(err){labErr(err);render()}}
  if(t.id==="urol"){const w=document.getElementById("ulinkw"),s=document.getElementById("ulink"),r=t.value;w.hidden=r==="bo";const list=r==="tenant"?S.tenants:r==="owner"?S.owners:r==="admin"?S.administradoras.map(a=>({id:a.id,nombre:a.nombre})):[];s.innerHTML=(r==="admin"?"":'<option value="new">Crear ficha nueva</option>')+list.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join("");}
});
document.addEventListener("input",e=>{

  if(id==="q"||id==="labq"){if(id==="q")ui.q=e.target.value;else ui.lab.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById(id);if(q){q.focus();q.setSelectionRange(pos,pos)}}

document.addEventListener("submit",e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==="loginform")doLogin();
  if(id==="regform")doRegister();
  if(id==="msgform"){const to=document.getElementById("mto").value,t=document.getElementById("mtext");if(!t.value.trim()){t.focus();return}S.msgs.push({id:uid("m"),from:meActor(),to,text:t.value.trim(),fecha:todayISO(),read:false,canal:"plataforma"});ui.msgTo=to;save();render();toast("Mensaje enviado a "+nombreActor(to));}
  if(id==="paramform"){const v=x=>Number(document.getElementById(x).value);const p=S.params;
    const dia=Math.min(28,Math.max(1,Math.round(v("p_dia")))),com=v("p_com");
    if(!(v("p_uf")>0)||!(com>=0&&com<=20)){toast("Revisa los valores: UF mayor que cero y comisión entre 0 y 20%");return}
    p.uf=Math.round(v("p_uf"));p.ipc=v("p_ipc");p.comision=com;p.gracia=Math.max(0,Math.round(v("p_gracia")));
    if(dia!==p.diaVenc){p.diaVenc=dia;S.periodo.vence=S.periodo.vence.slice(0,8)+pad(dia)}
    document.querySelectorAll("[data-medio]").forEach(c=>p.medios[c.dataset.medio]=c.checked);
    const tpl=document.getElementById("p_tpl").value.trim();if(tpl)p.plantilla=tpl;
    p.bienvenida.activo=document.getElementById("p_bon").checked;const bt=document.getElementById("p_btxt").value.trim();if(bt)p.bienvenida.texto=bt;
    log("Parámetros","UF "+clp(p.uf)+", IPC "+p.ipc+"%, comisión "+p.comision+"%, vencimiento día "+p.diaVenc);save();render();toast("Parámetros guardados");}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&mroot.innerHTML)closeModal();
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("seg")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});
